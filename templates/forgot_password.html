<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Asistente Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm border-0 rounded-4 p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-primary">Recuperar Contraseña</h4>
            <p class="text-muted small">Ingresa tu usuario y el correo del calendario registrado.</p>
        </div>

        {% if error %}
            <div class="alert alert-danger rounded-3 py-2 small">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="alert alert-success rounded-3 py-2 small">{{ success }}</div>
            <div class="text-center mt-3">
                <a href="/login" class="btn btn-primary w-100 rounded-pill py-2 fw-bold text-decoration-none">Ir al Login</a>
            </div>
        {% else %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Usuario / ID</label>
                    <input type="text" name="username" class="form-control rounded-pill px-3" required placeholder="Ej. default o tu ID">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Correo del Calendario (calendar_id)</label>
                    <input type="email" name="calendar_id" class="form-control rounded-pill px-3" required placeholder="correo@gmail.com">
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Nueva Contraseña</label>
                    <input type="password" name="new_password" class="form-control rounded-pill px-3" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold">Restablecer Contraseña</button>
            </form>
            <div class="text-center mt-3">
                <a href="/login" class="text-decoration-none small text-muted">← Volver al Login</a>
            </div>
        {% endif %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
