<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Asistente Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">🏥 Iniciar Sesión</h3>
            <p class="text-muted small">Panel de administración de citas</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small text-center" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label for="username" class="form-label small fw-bold text-secondary">Usuario</label>
                <input type="text" class="form-control rounded-pill px-3" id="username" name="username" required placeholder="Ingresa tu usuario">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label small fw-bold text-secondary">Contraseña</label>
                <input type="password" class="form-control rounded-pill px-3" id="password" name="password" required placeholder="••••••••">
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary rounded-pill py-2 fw-bold shadow-sm">Entrar al Sistema</button>
            </div>
            <div class="text-center mt-3">
                <p class="small text-muted mb-1">Crea una cuenta <a href="/register" class="text-decoration-none fw-bold"> Aquí</a></p>
                <p class="small text-muted mb-0"><a href="/forgot-password" class="text-decoration-none text-secondary">¿Olvidaste tu contraseña?</a></p>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
